name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files exist
        run: |
          for f in README.md LICENSE SAFETY.md CONTRIBUTING.md web/index.html; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Relative markdown links resolve
        run: python3 scripts/check_links.py
      - name: No secrets committed
        run: |
          if grep -rIEn --exclude-dir=.git '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|eyJhbGciOi[A-Za-z0-9_.-]{40,})' .; then
            echo "possible secret found"; exit 1
          fi
