<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenDiag mock (plain)</title>
<style>
:root { --bg:#fff; --fg:#000; --dim:#6b6b6b; --line:#c8c8c8; --row:#f2f2f2; --accent:#0a60c8; --bad:#b00020; --ok:#1a7f37; }
@media (prefers-color-scheme: dark) { :root { --bg:#000; --fg:#fff; --dim:#8e8e8e; --line:#2c2c2c; --row:#111; --accent:#4da3ff; --bad:#ff6b6b; --ok:#5ad17a; } }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.3 -apple-system, "Helvetica Neue", Arial, sans-serif; }
#app { max-width: 640px; margin: 0 auto; min-height: 100vh; border-left:1px solid var(--line); border-right:1px solid var(--line); }
header { display:flex; align-items:center; height:48px; border-bottom:1px solid var(--line); padding:0 12px; position:sticky; top:0; background:var(--bg); }
header .back { color:var(--accent); cursor:pointer; min-width:70px; background:none; border:0; font:inherit; padding:0; text-align:left; }
header .title { flex:1; text-align:center; font-weight:600; }
header .spacer { min-width:70px; }
.banner { padding:6px 12px; font-size:13px; border-bottom:1px solid var(--line); color:var(--dim); }
.banner b { color:var(--fg); }
h2 { margin:0; padding:18px 12px 6px; font-size:13px; font-weight:400; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
.list { border-top:1px solid var(--line); }
.row { display:flex; align-items:center; gap:8px; min-height:44px; padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
.row.static { cursor:default; }
.row .l { flex:1; }
.row .sub { color:var(--dim); font-size:13px; }
.row .r { color:var(--dim); font-family: ui-monospace, Menlo, monospace; font-size:14px; }
.row .chev::after { content:">"; color:var(--dim); margin-left:6px; }
.row:active { background:var(--row); }
.bad { color:var(--bad); }
.note { padding:12px; color:var(--dim); font-size:14px; }
pre { margin:0; padding:12px; font:13px/1.4 ui-monospace, Menlo, monospace; white-space:pre-wrap; border-bottom:1px solid var(--line); }
button.act, input { font:inherit; color:var(--fg); }
button.act { display:block; width:100%; min-height:48px; background:none; border:0; border-bottom:1px solid var(--line); color:var(--accent); text-align:center; cursor:pointer; }
button.act.danger { color:var(--bad); }
button.act:disabled { color:var(--dim); cursor:not-allowed; }
input { width:calc(100% - 24px); margin:8px 12px; padding:8px; background:var(--bg); border:1px solid var(--line); font-family: ui-monospace, Menlo, monospace; }
:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// MOCK ONLY. Constant sample data. No vehicle code. The only user text (typed confirmation) is escaped.
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const car = { vin:"WBA00000000000001", adapter:"Simulator" };
const modules = [
  ["DME","Engine control","0x12", 2], ["EGS","Transmission","0x18", 0], ["DSC","Stability control","0x29", 1],
  ["KOMBI","Instrument cluster","0x60", 0], ["FRM","Footwell module","0x72", 0], ["CAS","Car access","0x00", 0],
  ["IHKA","Climate","0x78", 0], ["HU","Head unit","0x63", 3]
];
const faults = {
  DME: [["P0301","Cylinder 1 misfire detected","stored"],["P0171","Fuel trim too lean, bank 1","pending"]],
  DSC: [["C1234","Wheel speed sensor signal implausible","stored"]],
  HU:  [["U0100","Lost communication with engine module","stored"],["B1A2B","Microphone circuit open","stored"],["U0155","Lost communication with cluster","pending"]]
};
const live = [["Engine speed","812 rpm"],["Coolant temp","91 C"],["Intake air temp","24 C"],["Battery voltage","12.7 V"],["Throttle","14 %"],["Vehicle speed","0 km/h"]];
const settings = [["Ambient light brightness","Extended"],["Welcome light","Off"],["Daytime running lights","On"],["Auto start-stop memory","Off"]];
let state = { screen:"connect", mod:null, opt:0, typed:"" };
const parent = { vehicle:"connect", modules:"vehicle", faults:"modules", live:"vehicle", settings:"faults", change:"settings", backups:"vehicle", diff:"backups" };
function go(screen, extra){ state = Object.assign({}, state, { typed:"" }, extra || {}, { screen }); render(); window.scrollTo(0,0); }
function back(){ go(parent[state.screen] || "connect"); }
function hdr(title){
  const b = state.screen === "connect" ? '<span class="spacer"></span>' : '<button class="back" data-back="1">&lt; Back</button>';
  return '<header>' + b + '<div class="title">' + esc(title) + '</div><span class="spacer"></span></header><div class="banner"><b>MOCK</b> sample data. Read-only build. No car connected.</div>';
}
function row(l, r, sub, action, chev) {
  const a = action ? ' tabindex="0" data-go="' + esc(JSON.stringify(action)) + '"' : "";
  return '<div class="row' + (action ? "" : " static") + '"' + a + '><div class="l">' + l + (sub ? '<div class="sub">' + sub + "</div>" : "") + "</div>" + (r ? '<div class="r">' + r + "</div>" : "") + (chev ? '<span class="chev"></span>' : "") + "</div>";
}
const screens = {
  connect(){ return hdr("OpenDiag") + '<h2>Adapter</h2><div class="list">' + row("Simulator","ready","Pretend car for trying things",["vehicle"],true) + row("OBDLink CX (Bluetooth)","not found","",null,false) + row("WiFi ENET","not found","192.168.0.10 : 6801",null,false) + '</div><p class="note">Pick an adapter. Nothing is sent to the car until you open a screen that reads.</p>'; },
  vehicle(){ return hdr("Vehicle") + '<h2>Car</h2><div class="list">' + row("VIN", car.vin, "", null, false) + row("Adapter", car.adapter, "", null, false) + '</div><h2>Read</h2><div class="list">' + row("Modules and fault codes","8 modules","",["modules"],true) + row("Live data","","",["live"],true) + row("Backups","1 saved","",["backups"],true) + "</div>"; },
  modules(){ return hdr("Modules") + '<div class="list">' + modules.map((m) => row(m[0], m[3] ? '<span class="bad">' + m[3] + " faults</span>" : "OK", m[1] + " · " + m[2], ["faults", { mod:m[0] }], true)).join("") + '</div><p class="note">Tap a module to see its fault codes and settings.</p>'; },
  faults(){ const f = faults[state.mod] || []; return hdr(state.mod) + '<h2>Fault codes</h2><div class="list">' + (f.length ? f.map((x) => row(x[0] + " &nbsp; " + x[1], x[2], "Stored in " + state.mod + ". Meaning: our own wording, source tagged.", null, false)).join("") : row("No fault codes","","",null,false)) + '</div><h2>Settings</h2><div class="list">' + row("Read settings (coding)","","Read only. Backup first.",["settings"],true) + '</div><button class="act" disabled>Clear faults (needs bench module)</button>'; },
  live(){ return hdr("Live data") + '<div class="list">' + live.map((x) => row(x[0], x[1], "", null, false)).join("") + '</div><p class="note">Plain numbers. Updates about 5 times a second. Every value also fits in a table for screen readers.</p>'; },
  settings(){ return hdr("Settings") + "<h2>Current values (read only)</h2>" + '<div class="list">' + settings.map((s, i) => row(s[0], s[1], "", ["change", { opt:i }], true)).join("") + '</div><p class="note">Decoded from the backup. Changing is only offered in the Lab build on a bench module.</p>'; },
  change(){
    const s = settings[state.opt]; const ok = state.typed === "CHANGE";
    return hdr("Change setting") + '<div class="list">' + row(s[0], s[1], "Now", null, false) + row("New value","Extended","",null,false) + "</div><h2>What will happen</h2><pre>1. Backup read twice, hashes match   ok\n2. Same module as backup (serial)     ok\n3. Battery 12.7 V (min 12.5 V)        ok\n4. Write byte 12: 01 -&gt; 02\n   Checksum bytes 62-63 recalculated\n5. Read back and compare\n6. If anything differs: restore backup</pre><h2>Type CHANGE to confirm</h2>" +
      '<input id="t" value="' + esc(state.typed) + '" autocomplete="off" autocapitalize="off" spellcheck="false">' +
      '<button class="act danger" id="w"' + (ok ? "" : " disabled") + '>Write to bench module</button><button class="act" data-back="1">Cancel</button>';
  },
  backups(){ return hdr("Backups") + '<div class="list">' + row("DME · 2026-11-20 14:02","","Verified: read twice, hash matches",["diff"],true) + '</div><button class="act" id="mk">Make new backup</button>'; },
  diff(){ return hdr("Compare") + "<pre>DME block 0x3000 (64 bytes)\n\n  offset  was  now\n  12      01   02    Ambient light: Standard -&gt; Extended\n  62      A1   7C    checksum\n  63      3F   09    checksum\n\n3 bytes differ. 1 setting changed.</pre>"; },
};
function render(keepFocus){
  const el = document.getElementById("app");
  const doc = new DOMParser().parseFromString(screens[state.screen](), "text/html");
  el.replaceChildren(...doc.body.childNodes);
  el.querySelectorAll("[data-back]").forEach((n) => n.addEventListener("click", back));
  el.querySelectorAll("[data-go]").forEach((n) => n.addEventListener("click", () => { const a = JSON.parse(n.dataset.go); go(a[0], a[1]); }));
  const t = document.getElementById("t");
  if (t) { t.addEventListener("input", () => { state.typed = t.value; render(true); }); if (keepFocus) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
  const w = document.getElementById("w"); if (w) w.addEventListener("click", () => alert("Mock only. Nothing was written."));
  const mk = document.getElementById("mk"); if (mk) mk.addEventListener("click", () => alert("Mock only."));
}
document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("row") && !e.target.classList.contains("static")) { e.preventDefault(); e.target.click(); } });
render();
</script>
</body>
</html>
